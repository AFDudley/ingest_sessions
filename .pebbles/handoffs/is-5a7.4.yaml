summary: >-
  The omp adapter required the `session` header at line 0; on the real corpus
  omp keeps a fixed-width, rewritten-in-place `title` record ahead of it (so
  the title can be updated without rewriting the transcript), which pushes the
  real header to line 1 for the overwhelming majority of files, silently
  routing them through the Claude Code reader instead. Added
  omp.find_header(lines, bound=omp.HEADER_SCAN_BOUND=2), which scans the
  leading lines for the first `type: "session"` object with a non-empty id
  instead of requiring index 0. core.probe_session_format and
  omp.ingest_omp_jsonl both call this SAME function over the SAME bounded
  window, so classification and ingestion can never disagree about whether a
  file is omp (verified directly: 0 disagreements across all 327 real files).
  Every line at or before the header index — the header itself, and any
  preamble ahead of it — is treated as preamble: never inserted as a record,
  never counted malformed; the header stays the sole source of session
  metadata (the preamble is never consulted for it). Bounding the scan to 2
  lines keeps a `session`-shaped line buried deep in a Claude Code transcript
  from ever being misclassified as omp. Nothing about DAG threading,
  versioning, subagent handling or field mapping changed. Seven new
  committed oracle probes (scripts/oracle_omp_*.py) implement the spec's
  acceptance tests; RED was verified by running each against the pre-fix
  tree (git stash of core.py/omp.py): oracle_omp_header_scan.py and
  oracle_omp_rehearsal.py raised ImportError (HEADER_SCAN_BOUND/find_header
  didn't exist yet), oracle_omp_preamble_invariance.py asserted false (the
  old code couldn't find a header at all once a title line was glued on top),
  and oracle_omp_classification.py reported the exact broken-baseline shape
  (16 omp / 311 claude, matching the pebble's measured 16/307 baseline).
  Verified GREEN at HEAD (51f3f92) against a throwaway, IN-MEMORY DuckDB
  cold-scanned over the real ~/.omp/agent/sessions corpus (327 files on this
  machine today, resolved from the invoking user's passwd entry — never
  $HOME, never the live database): all 327 files classify omp (was 16/327),
  0 probe/reader disagreements, 91,247 omp records (was ~201), 327 omp
  sessions (was 16), 0 surrogate uuids, 99.6% parent_uuid coverage, 311
  `title` preamble lines seen and none inserted as a record or counted
  malformed, and every stored session title traces to its file's header.
  The `records`/malformed_lines executemany insert under the schema's
  PRIMARY KEY + INSERT-OR-IGNORE is measurably slow in this environment
  (~350-400s to fully re-ingest the whole 343MB real corpus) — pre-existing
  and orthogonal to this fix (core.ingest_jsonl, unmodified here, shows the
  identical per-MB cost on a same-sized real Claude Code file); the oracle
  probes use an in-memory DuckDB (never a tempfile-backed one) to keep
  runtime comfortably inside the spec's timeout budgets rather than adding
  to that cost. All 12 acceptance-test predicates (c1-c12) were re-run fresh
  at HEAD and matched (see verify_transcript). git diff --name-only
  main...HEAD touches no wired-gate path per exophial.completion's own
  wired_gate_paths/discrimination_owed ({.pre-commit-config.yaml, cli.py,
  install.py, server.py} for this repo's [project.scripts]) — verified by
  calling that function directly against this branch's tree — so no
  discrimination record is owed. Pre-existing, unrelated flaky test
  tests/test_server.py::test_periodic_sync_eventually_embeds_new_records
  fails identically on unmodified main under this machine's current load
  (verified by checking out main's tree and re-running it in isolation); not
  a regression from this change.

