summary: >-
  The omp adapter required the `session` header at line 0; on the real corpus
  omp keeps a fixed-width, rewritten-in-place `title` record ahead of it (so
  the title can be updated without rewriting the transcript), which pushes the
  real header to line 1 for the overwhelming majority of files, silently
  routing them through the Claude Code reader instead. Added
  omp.find_header(lines, bound=omp.HEADER_SCAN_BOUND=2) (51f3f92), which scans
  the leading lines for the first `type: "session"` object with a non-empty id
  instead of requiring index 0. core.probe_session_format and
  omp.ingest_omp_jsonl both call this SAME function over the SAME bounded
  window, so classification and ingestion can never disagree about whether a
  file is omp (verified directly: 0 disagreements across all real files).
  Every line at or before the header index -- the header itself, and any
  preamble ahead of it -- is treated as preamble: never inserted as a record,
  never counted malformed; the header stays the sole source of session
  metadata. Bounding the scan to 2 lines keeps a `session`-shaped line buried
  deep in a Claude Code transcript from ever being misclassified as omp.
  Nothing about DAG threading, versioning, subagent handling or field mapping
  changed. Seven committed oracle probes (scripts/oracle_omp_*.py) implement
  the spec's acceptance tests; RED was verified against the pre-fix tree
  (checking out main's core.py/omp.py into this worktree): the classification
  oracle reproduced the exact broken-baseline shape, the header-scan/rehearsal
  oracles raised ImportError, and the preamble-invariance oracle asserted a
  header-not-found failure -- then all were restored to HEAD's fix.

  A first completion attempt (0a6333a) landed 11/12 predicates; the gate
  parked it because c6 (metamorphic/relation_class conservation) requires the
  artifact's stdout JSON to carry a numeric `flows` list summing to ~0
  (spec_oracle._relation_conservation has no equivalence executor, only
  conservation/no_arbitrage/monotonicity), and the original c6 script asserted
  row-equality internally without ever emitting `flows`. Fixed in 43f3332:
  for every entry either reading (header-at-line-0 vs. the same transcript
  with a title preamble glued on top) produces, build the tuple (id,
  parentId, type, sha256 of the entry's normalized content) plus one
  ("__malformed__",) tuple per malformed line, and emit one flow per distinct
  tuple t: w(t) * (count_A(t) - count_B(t)), where w(t) is a 40-bit weight
  derived from sha256(repr(t)) so a surplus of one tuple can never cancel a
  deficit of a different one. sum(flows) == 0 iff the two readings produced
  identical multisets of entries. Verified the encoding actually
  discriminates (a synthetic dropped-entry case sums to a large nonzero
  value) before wiring it to the real readings.

  Verified GREEN at HEAD (43f3332) against a throwaway, IN-MEMORY DuckDB
  cold-scanned over the real ~/.omp/agent/sessions corpus (328 files on this
  machine at this run, resolved from the invoking user's passwd entry --
  never $HOME, never the live database): all 328 files classify omp (was
  16/327 at the pebble's original measurement), 0 probe/reader disagreements,
  91,990 omp records (was ~201), 328 omp sessions (was 16), 0 surrogate
  uuids, 99.6% parent_uuid coverage, 312 `title` preamble lines seen and none
  inserted as a record or counted malformed, every stored session title
  traces to its file's header, and c6's flows sum to exactly 0. All 12
  acceptance-test predicates (c1-c12) re-run fresh and matched (see
  verify_transcript). Full unit suite green (322/322).

  The `records`/malformed_lines executemany insert under the schema's
  PRIMARY KEY + INSERT-OR-IGNORE is measurably slow in this environment
  (~350-400s to fully re-ingest the whole ~340MB real corpus) -- pre-existing
  and orthogonal to this fix (core.ingest_jsonl, unmodified here, shows the
  identical per-MB cost on a same-sized real Claude Code file); the oracle
  probes use an in-memory DuckDB (never a tempfile-backed one) to keep
  runtime comfortably inside the spec's timeout budgets rather than adding to
  that cost. git diff --name-only main...HEAD touches no wired-gate path per
  exophial.completion's own wired_gate_paths/discrimination_owed
  ({.pre-commit-config.yaml, cli.py, install.py, server.py} for this repo's
  [project.scripts]) -- verified by calling that function directly against
  this branch's tree at each commit -- so no discrimination record is owed.

