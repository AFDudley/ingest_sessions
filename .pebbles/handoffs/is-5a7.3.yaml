summary: >-
  Wired the already-built omp adapter into all three ingest call sites via one
  shared, content-based router: core.probe_session_format classifies a file as
  omp|claude from ONLY its first line (a type=="session" header with a
  non-empty id is omp; anything else is claude — never a path check), and
  core.ingest_routed_file is the single place cli.ingest, server._ingest_all
  and server._ingest_file_full all call instead of unconditionally calling
  core.ingest_jsonl. The router calls omp.ingest_omp_jsonl directly (never
  omp.ingest_omp_session, which would re-trigger discover_subagent_files' own
  fan-out and double-insert a subagent transcript's rows once discovery's
  recursive walk also hands that subagent file over as its own path); every
  omp file's session_id — parent or subagent — comes from that file's own
  header id via ingest_omp_session_metadata, never the filename stem.
  file_mtimes bookkeeping (file_changed/record_file) wraps the router
  identically for both formats. This resumes two prior blocked attempts on
  this pebble: the routing implementation itself (recovered from wip/is-5a7-3,
  cherry-picked in as ab8ac2b) was already correct on both prior passes and is
  unchanged here. What was still wrong was scripts/oracle_file_mtimes_bookkeeping.py's
  real-corpus half (c5): its first correction (c8194b1, cherry-picked from the
  same recovered work) emitted claude coverage as an explicit set difference
  instead of a frozen 7,779-file floor, but it still resolved the real
  ~/.claude and ~/.omp roots via core.default_discovery_roots() -> Path.home(),
  and the acceptance grader pins HOME to a fresh empty scratch directory per
  grading pass — so the prior gate run measured two empty roots and reported a
  vacuous 0-missing-of-0-present pass (omp_paths_recorded=0 alongside
  claude_paths_on_disk_missing_from_file_mtimes=0), while a direct shell run
  returned the real 323/0. Fixed in 8fee661: the oracle's real-corpus check now
  resolves the invoking user's actual home via
  pwd.getpwuid(os.getuid()).pw_dir — never $HOME, never Path.home() — and
  additionally emits claude_paths_on_disk_count so an empty/near-empty root
  fails the new >=100 predicate loudly instead of the set-difference check
  passing vacuously. Product code (core.default_discovery_roots()) is
  unchanged; only the acceptance probe needed the passwd entry, because only
  the probe runs under a sandboxed HOME. Verified by running all 5 spec
  oracles directly (not simulated) at HEAD: c1 classifies a relocated
  omp-shaped sample as omp and a claude-shaped sample sitting in an
  omp-looking path as claude; c2 shows zero surrogate uuids and a real
  first_prompt through all three call sites (parent_uuid_nonnull_rate 0.875
  >= 0.85); c3 shows a subagent file ingested exactly once (3 rows, not 6);
  c4 shows the subagent's session_id comes from its own header, never the
  parent's id or the filename stem; c5 shows idempotent re-scans,
  append-detection, 323 real omp paths recorded (>=300), 3,848 real
  ~/.claude/projects *.jsonl files on disk (>=100), and zero of those missing
  from file_mtimes. The full unit suite (322 tests) passes. Two ablation
  discrimination proofs (below) were re-executed fresh at this branch's HEAD
  — not copied from a prior pass — confirming server.py and cli.py, both
  wired-gate console-script modules per completion._console_script_paths,
  actually carry the routing decision: reverting either one alone in an
  isolated throwaway copy of the tree reproduces the pre-fix surrogate-uuid
  symptom at exactly the call site(s) that were reverted, and nowhere else.

