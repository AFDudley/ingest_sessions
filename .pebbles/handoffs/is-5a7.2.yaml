cost: "~160k tokens"

summary: |
  Collapsed the two hardcoded, shallow directory walks (server.py's cold
  scan: projects_dir.iterdir() + proj_dir.glob("*.jsonl"); cli.py's batch
  ingester: the same glob per resolved project dir) into one recursive,
  multi-root discovery function shared by every caller. Added
  core.discover_session_files(roots) (recursive rglob per root, skips a
  missing root instead of raising) and core.resolve_discovery_roots
  (env_value) (parses INGEST_SESSIONS_PROJECTS_DIR as os.pathsep-separated
  paths into the WHOLE root list, replacing the old single-Path env var
  that dropped ~/.claude coverage whenever set, defaulting to
  [~/.claude/projects, ~/.omp/agent/sessions]). server._discovery_roots()
  is the single call site both _ingest_all (cold scan) and the new
  server._schedule_watches/_start_watcher (watchdog) draw from. cli.py's
  per-project-dir walk now calls the same discover_session_files() instead
  of its own glob.

  Verified outside-in: authored the 5 acceptance oracle scripts named by
  the linked spec FIRST, observed all 5 fail against the unmodified base
  tree at 9c2961c, implemented, then got exactly the spec's expected
  stdout_json values for every clause at 6a38c8e. Full pytest suite (288),
  mypy, ruff, pre-commit all clean.

  DISCRIMINATION (second pass, after the integrator parked the first
  handoff): cli.py and server.py are both wired gates in this repo
  (pyproject [project.scripts] console-script targets), so each needed an
  executed ablation proof. server.py: check_watchdog_roots.py (the only one
  of the 5 spec oracles that actually calls into server.py) killed cleanly
  — scheduled_count/all_recursive -> AttributeError when server.py was
  reverted to its pre-work single-root wiring in a throwaway tree.
  check_default_roots.py was ALSO re-run against the ablated server.py per
  the resume instructions but did NOT move (it calls
  core.resolve_discovery_roots() directly and never touches server.py) —
  recorded here as an honest vacuity finding, not used as evidence.
  cli.py had no covering oracle at all among the original 5 (none of them
  exercise cli.py), so scripts/check_cli_recursive_discovery.py was
  authored and committed (a2e10c5): it drives the real cli.ingest() over a
  synthetic ~/.claude/projects/<name>/a/b/c/session.jsonl tree and killed
  cleanly under ablation (sessions_found 1 -> 0) when cli.py was reverted
  to its pre-work proj_dir.glob("*.jsonl") two-level walk. Both throwaway
  trees were rm -rf'd after use; the proofs are pinned to the two committed
  oracle scripts, which re-run the ablated-vs-real contrast on demand.
