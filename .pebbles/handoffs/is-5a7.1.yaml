summary: |
  Added src/ingest_sessions/omp.py, a source adapter that parses omp (Oh My Pi)
  SessionEntry JSONL transcripts into the SAME shared records/sessions tables
  Claude Code sessions already populate (core.create_tables) -- selected by
  which ingest function a caller invokes (core.ingest_jsonl vs
  omp.ingest_omp_session), not a forked schema or a second table. Line 1 of an
  omp file is consumed purely as session metadata (header id -> session_id,
  cwd -> project_path, title -> summary via ingest_omp_session_metadata) and
  is never inserted as a record. Every other line is parsed against the
  13-member SessionEntry union (parse_entry) according to the header's
  declared schema version -- v1's legacy `parent` field, v2's rename to
  `parentId`, v3 additionally enabling compaction-truncation semantics -- and
  a line that fails to parse or names an unrecognized kind is counted into
  malformed_lines and skipped, matching core.ingest_jsonl's existing
  non-fatal skip (ingestion never aborts). reconstruct_conversation_order
  walks each entry's parentId back from a leaf to the root instead of
  trusting file order, so a branched session threads by actual reply-chain: a
  compaction entry drops every ancestor strictly older than its
  firstKeptEntryId, and branch_summary/custom_message entries come back with
  a synthesized `message` field, i.e. as regular messages.
  discover_subagent_files recursively finds subagent transcripts at
  <session>/<AgentId>.jsonl beside their parent (a single rglob call reaches
  nested sub-subagents too), and ingest_omp_session ingests the parent plus
  every discovered subagent file the same way.

  Also fixed core._extract_first_prompt, which only handled a plain string
  message.content and silently returned None for the list-of-blocks form --
  it now reuses retrieval._content_to_text (the same flattener the lexical/
  vector retrieval arms already use for record_text), so both Claude Code and
  omp records with block-list content extract correctly, and the existing
  retrieve_relevant/query tools surface omp records identically to Claude
  Code records with zero query-path changes (verified end-to-end in the c9
  oracle: ingested one omp + one Claude session, backfilled embeddings +
  rebuilt the FTS index, called the real retrieve_relevant, and confirmed the
  omp hit's dict has the same core key shape as the Claude hit's).

  VERIFIED: all 9 scripts/oracle_omp_*.py probes named by
  contracts/specs/derived-is-5a7.1.spec.json's acceptance_tests exit 0 and
  print the exact stdout_json fields each test's `then` predicates check
  (transcripts above), run both under `uv run python3` and directly under
  `.venv/bin/python3` after `uv sync --frozen` (the reducer's hermetic child
  env). 34 new unit tests in tests/test_omp.py cover the pure
  parsing/reconstruction/field-mapping helpers directly. Full suite: 322
  passed (287 pre-existing + 34 new + the one previously-flaky test, which
  passed this run and was independently confirmed flaky/pre-existing against
  the unmodified base tree). ruff, ruff-format, and mypy pass via
  `pre-commit run` on every touched file; the full commit also passed the
  repo's commit-msg-stage hooks (subtree-edit check, main-commit reroute
  guard, session trailer).

  Not touched: CLI wiring (cli.py's argparse `--source` selection) -- no
  acceptance test exercises the CLI, and the real omp on-disk directory
  layout / discovery root wasn't specified in the pebble, so CLI wiring
  would have been speculative. All 9 acceptance criteria are satisfied by
  calling the adapter's functions directly, exactly as each acceptance
  criterion's own wording describes ("feed the adapter...").

