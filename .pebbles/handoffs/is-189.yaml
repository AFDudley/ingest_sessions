summary: |
  Pebble is-189: bound the ingest_sessions MCP server's single DB thread so a
  slow op can no longer starve the FIFO queue (the MCP query-timeout root
  cause — head-of-line blocking, NOT lock contention) and cap memory so RSS
  can't grow to ~80% of RAM (the 42GB footprint). Implemented all three
  in-scope changes; did NOT touch the query(sql)/LIKE->FTS interface (is-f18).

  THREE CHANGES (server.py):
  1. Per-op interrupt — _db_loop now runs each req.fn(db) via _run_op_with_budget,
     which arms a threading.Timer that calls db.interrupt() if the op exceeds an
     env-overridable budget and cancels it on completion. Verified run-before-read
     against duckdb 1.4.4: there is NO SET statement_timeout; interrupt() from
     another thread is the supported per-op cancel — it raises InterruptException
     in the running op, the loop records req.error, the queue drains, and the next
     (trivial) op runs on the still-usable connection. This is the change that
     actually unblocks the starved query.
  2. Bounded connect — _connect_db opens duckdb.connect(path, config={memory_limit,
     threads}) with conservative env-overridable defaults (4GB / 4) so the no-config
     ~80%-RAM / all-cores defaults no longer apply.
  3. Bounded waiter — _db_execute awaits req.done.wait(_db_wait_timeout_sec())
     (default 60s, deliberately > the op budget) and raises an explicit TimeoutError
     instead of the old silent infinite req.done.wait().

  Env vars INGEST_SESSIONS_DB_MEMORY_LIMIT / _DB_THREADS / _DB_OP_BUDGET_SEC /
  _DB_WAIT_TIMEOUT_SEC documented in README Configuration table.

  OUTER LOOP (tests/test_db_thread_bounding.py) drives the real _db_loop /
  _db_submit machinery (no mocks; module globals reset per test for isolation):
  a head-of-line test submits a long cross-join then a trivial SELECT 1 and
  asserts the trivial op completes within a bounded wall-clock (because the long
  op is interrupted at a 1s budget) plus that the long op surfaced an explicit
  error; a config test asserts the live connection reports bounded memory_limit
  + threads. Both RED on unmodified code (head-of-line starved; threads reported
  32), GREEN after the fix. Full suite 288 passed; mypy clean.

  ATTENTION COORDINATOR — stale task framing corrected (affects integration):
  the task prompt said agent_tools/ingest_sessions is "a monorepo-only path, NOT
  an mtm subtree" with "NO git-subtree-dir trailer". That is no longer true:
  subtrees.tsv (the source of truth) lists `agent_tools/ingest_sessions
  ingest-sessions` as a subtree (ADR 2026-06-24-agent-tools-subtrees), and the
  check-subtree-edits hook ENFORCES the trailer — the commit only passed with
  `git-subtree-dir: agent_tools/ingest_sessions`. Integration therefore needs the
  subtree round-trip (`scripts/subtree-sync.sh push agent_tools/ingest_sessions`)
  before the --no-ff merge into main, same as the recent exo-6c4.10 work. This
  handoff lives inside the subtree's own .pebbles/handoffs/ (the is- tracker) and
