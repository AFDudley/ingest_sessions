[project]
name = "ingest-sessions"
version = "0.2.0"
description = "MCP server for querying Claude Code session transcripts via DuckDB"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastembed>=0.8.0",
    # Upper bound is load-bearing (pebble is-19e): this server is written
    # against mcp's 1.x low-level API. 2.0.0 both dropped the
    # `mcp.types.AnyUrl` re-export and removed `Server.list_tools`, so a fresh
    # resolve under the old open `mcp>=1.0` installed 2.0.0 and the service
    # crash-looped on import. Porting to the 2.x API is its own change; until
    # then the bound is what makes an install reproducible.
    "mcp>=1.0,<2",
    # Direct: server.py imports AnyUrl from pydantic. It is also a transitive
    # dep of mcp, but mcp dropped its `mcp.types.AnyUrl` re-export in 2.0.0, so
    # the import is ours to declare rather than inherit (pebble is-19e).
    "pydantic>=2",
    "starlette>=0.27",
    "uvicorn>=0.20",
    "watchdog>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
ingest-sessions = "ingest_sessions.cli:main"
ingest-sessions-server = "ingest_sessions.server:cli"
ingest-sessions-install = "ingest_sessions.install:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_sessions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# scripts/ holds standalone operator tools (consumer-side adapters) that are
# not part of the importable package; expose them to the test runner so their
# PURE parse functions can be unit-tested directly.
pythonpath = ["scripts"]

[tool.mypy]
# Resolve standalone scripts (e.g. scripts/supersession_adapter.py) when a test
# imports them, so mypy type-checks the import rather than reporting it missing.
mypy_path = "scripts"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]
